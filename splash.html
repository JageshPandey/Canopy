<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Dark mist gradient */
      background: radial-gradient(circle at 50% 30%, #1e293b 0%, #050914 80%);
      border-radius: 12px;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.05);
      position: relative;
    }
    img {
      height: 90px;
      animation: pulse 2s infinite ease-in-out;
      margin-bottom: 20px;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(20, 184, 166, 0.3)); }
      50% { transform: scale(1.05); opacity: 1; filter: drop-shadow(0 0 25px rgba(20, 184, 166, 0.6)); }
      100% { transform: scale(0.95); opacity: 0.8; filter: drop-shadow(0 0 10px rgba(20, 184, 166, 0.3)); }
    }
    .loading-bar-container {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 150px;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      overflow: hidden;
    }
    .loading-bar {
      height: 100%;
      width: 0%;
      background: #14b8a6;
      border-radius: 3px;
      box-shadow: 0 0 8px rgba(20, 184, 166, 0.8);
      animation: load 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }
    @keyframes load {
      0% { width: 0%; transform: translateX(-100%); }
      50% { width: 50%; transform: translateX(50%); }
      100% { width: 100%; transform: translateX(0); }
    }
  </style>
</head>
<body>
  <img src="logo_full.png" alt="Canopy">
  <div class="loading-bar-container">
    <div class="loading-bar"></div>
  </div>
</body>
</html>
