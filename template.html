<style>
  :root {
    --bg-color: #f7f6f2;
    --bg-color: #ffffff; --text-color: #0f172a; --sidebar-bg: rgba(255, 255, 255, 0.4);
    --hover-bg: rgba(0, 0, 0, 0.05); --border-color: rgba(0, 0, 0, 0.1);
    --accent: #0f766e;
    --mist-gradient: linear-gradient(135deg, rgba(168, 237, 234, 0.7) 0%, rgba(254, 214, 227, 0.5) 100%);
    --glass-bg: rgba(255, 255, 255, 0.5);
    --icon-size: 96px;
    --grid-gap: calc(var(--icon-size) * 0.25);
    font-family: 'Inter', sans-serif;
  }
  body.theme-dark {
    --bg-color: #020617; --text-color: #f8fafc; --sidebar-bg: rgba(2, 6, 23, 0.6);
    --hover-bg: rgba(255, 255, 255, 0.05); --border-color: rgba(255, 255, 255, 0.05);
    --accent: #14b8a6;
    --mist-gradient: linear-gradient(135deg, #061f2d 0%, #04221c 100%);
    --glass-bg: rgba(2, 6, 23, 0.7);
  }

  * { box-sizing: border-box; }
  body {
    font-family: 'Inter', sans-serif;
    margin: 0; padding: 0; display: flex; height: 100vh;
    background: var(--mist-gradient); color: var(--text-color);
    overflow: hidden;
  }
  
  /* Sidebar */
  #sidebar {
    width: 260px; background: var(--sidebar-bg);
    backdrop-filter: blur(20px);
    border-right: 1px solid var(--border-color);
    display: flex; flex-direction: column;
    flex-shrink: 0; transition: width 0.3s ease;
  }
  body.sidebar-hidden #sidebar { width: 0; border: none; }
  .sidebar-header {
    padding: 16px; font-weight: 600; font-size: 14px;
    border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; gap: 8px;
  }
  .tree-container {
    flex-grow: 1; overflow-y: auto; padding: 8px 0;
  }
  .tree-node {
    display: flex; align-items: center; padding: 6px 12px;
    cursor: pointer; font-size: 13px; user-select: none;
    color: var(--text-color); gap: 6px; white-space: nowrap;
  }
  .tree-node:hover { background-color: var(--hover-bg); }
  .tree-node.active { background-color: var(--accent); color: white; }
  .tree-node.active svg { color: white; }
  .tree-children { display: none; }
  .tree-children.open { display: block; }
  .tree-arrow { width: 14px; display: flex; align-items: center; justify-content: center; opacity: 0.6; }
  .tree-arrow:hover { opacity: 1; }

  /* Main Area */
  #main-area {
    flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;
    background: var(--glass-bg); backdrop-filter: blur(20px);
  }
  
  /* Toolbar */
  .toolbar {
    height: 56px; display: flex; align-items: center; padding: 0 16px; gap: 8px;
    border-bottom: 1px solid var(--border-color); flex-shrink: 0;
    background: transparent;
  }
  .nav-btn {
    background: none; border: none; color: var(--text-color);
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    width: 32px; height: 32px; border-radius: 6px;
  }
  .nav-btn:hover:not(:disabled) { background-color: var(--hover-bg); }
  .nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }
  
  .breadcrumbs {
    flex-grow: 1; display: flex; align-items: center; font-size: 14px;
    overflow-x: auto; white-space: nowrap; gap: 4px;
  }
  .breadcrumbs::-webkit-scrollbar { display: none; }
  .crumb {
    cursor: pointer; padding: 4px 8px; border-radius: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .crumb:hover { background-color: var(--hover-bg); }
  .crumb-separator { opacity: 0.4; }

  .title-bar-title { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 14px; opacity: 0.9;}
  .title-bar-title img { width: 18px; height: 18px; }
  
  .zoom-control {
    display: flex; align-items: center; gap: 8px; font-size: 12px;
    color: var(--text-muted);
  }
  input[type="range"] { accent-color: var(--accent); }

  /* Grid View */
  #grid-view {
    display: grid; padding: 24px; overflow-y: auto; flex-grow: 1; align-content: start;
    grid-template-columns: repeat(auto-fill, minmax(calc(var(--icon-size) + 40px), 1fr));
    gap: var(--grid-gap);
  }
  .grid-item {
    display: flex; flex-direction: column; align-items: center; text-align: center;
    padding: 12px; border-radius: 12px; cursor: pointer; transition: 0.15s;
    user-select: none;
  }
  .grid-item:hover { background: var(--hover-bg); }
  
  .item-icon {
    width: var(--icon-size); height: var(--icon-size);
    margin-bottom: 8px; position: relative;
    border-radius: 8px; overflow: hidden;
    flex-shrink: 0;
  }
  .item-thumb {
    width: 100%; height: 100%; object-fit: contain;
    animation: fadeIn 0.15s ease-out;
  }
  
  .item-name {
    font-size: 13px; line-height: 1.3; margin-bottom: 4px;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
    overflow: hidden; word-break: break-all;
  }
  .item-meta {
    font-size: 11px; opacity: 0.6; text-align: center;
    display: flex; flex-direction: column; gap: 2px; align-items: center;
  }
  
  /* List Mode */
  #grid-view.list-mode {
    display: flex; flex-direction: column; gap: 4px; padding: 16px 24px;
  }
  #grid-view.list-mode .grid-item {
    flex-direction: row; text-align: left; padding: 8px 16px; width: 100%;
    border-bottom: 1px solid var(--border-color); border-radius: 8px;
  }
  #grid-view.list-mode .item-icon {
    width: 32px; height: 32px; margin-bottom: 0; margin-right: 16px;
  }
  #grid-view.list-mode .item-name {
    flex-grow: 1; margin-bottom: 0; -webkit-line-clamp: 1; font-size: 14px;
  }
  #grid-view.list-mode .item-meta {
    flex-direction: row; justify-content: flex-end; align-items: center; gap: 24px;
    text-align: right; min-width: 300px;
  }
  #grid-view.list-mode .item-meta span { min-width: 120px; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* Custom Scrollbars */
    html { scroll-behavior: smooth; }
    .main-content, .sidebar-content, .state-view { scroll-behavior: smooth; }
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.02);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(20, 184, 166, 0.3);
      border-radius: 6px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(20, 184, 166, 0.6);
    }
    body.dark-mode ::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }
    body.dark-mode ::-webkit-scrollbar-thumb {
      background: rgba(20, 184, 166, 0.4);
    }
    body.dark-mode ::-webkit-scrollbar-thumb:hover {
      background: rgba(20, 184, 166, 0.8);
    }
  
  </style>

<div id="main-area">
  <div class="toolbar">
    <button class="nav-btn" id="btn-toggle-sidebar" title="Toggle Sidebar"><i data-lucide="panel-left"></i></button>
    <button class="nav-btn" id="btn-back" disabled title="Back"><i data-lucide="arrow-left"></i></button>
    <button class="nav-btn" id="btn-fwd" disabled title="Forward"><i data-lucide="arrow-right"></i></button>
    <div class="breadcrumbs" id="breadcrumbs"></div>
    <div class="zoom-control">
      <i data-lucide="zoom-out" style="width:14px;height:14px"></i>
      <input type="range" class="zoom-slider" id="zoom-slider" min="48" max="192" value="96" step="16">
      <i data-lucide="zoom-in" style="width:14px;height:14px"></i>
    </div>
    <button class="nav-btn" id="btn-toggle-view" title="Toggle View"><i data-lucide="list"></i></button>
    <button class="nav-btn" id="btn-theme" title="Toggle Theme"><i data-lucide="moon"></i></button>
  </div>
  <div id="grid-view"></div>
</div>

<script>
const rawTree = __TREE_DATA__;

const nodeMap = new Map();
function indexTree(node, parent = null) {
  node.id = Math.random().toString(36).substr(2, 9);
  node.parent = parent;
  nodeMap.set(node.id, node);
  if (node.children) {
    node.children.sort((a, b) => {
      if (a.is_dir === b.is_dir) return a.name.localeCompare(b.name);
      return a.is_dir ? -1 : 1;
    }).forEach(c => indexTree(c, node));
  }
}
indexTree(rawTree);

let historyStack = [];
let historyIndex = -1;

function navigate(nodeId, pushHistory = true) {
  const node = nodeMap.get(nodeId);
  if (!node || !node.is_dir) return;

  if (pushHistory) {
    historyStack = historyStack.slice(0, historyIndex + 1);
    historyStack.push(nodeId);
    historyIndex++;
  }
  
  updateToolbar();
  renderGrid(node);
  renderBreadcrumbs(node);
  highlightSidebar(nodeId);
}

document.getElementById('btn-back').addEventListener('click', () => {
  if (historyIndex > 0) {
    historyIndex--;
    navigate(historyStack[historyIndex], false);
  }
});
document.getElementById('btn-fwd').addEventListener('click', () => {
  if (historyIndex < historyStack.length - 1) {
    historyIndex++;
    navigate(historyStack[historyIndex], false);
  }
});
document.getElementById('btn-toggle-sidebar').addEventListener('click', () => {
  document.body.classList.toggle('sidebar-hidden');
});

document.getElementById('btn-theme').addEventListener('click', () => {
  document.body.classList.toggle('theme-dark');
  const isDark = document.body.classList.contains('theme-dark');
  document.getElementById('btn-theme').innerHTML = isDark ? '<i data-lucide="sun"></i>' : '<i data-lucide="moon"></i>';
  lucide.createIcons();
});

function updateToolbar() {
  document.getElementById('btn-back').disabled = historyIndex <= 0;
  document.getElementById('btn-fwd').disabled = historyIndex >= historyStack.length - 1;
}

function renderSidebarNode(node, container, level = 0) {
  if (!node.is_dir) return;

  const row = document.createElement('div');
  row.className = 'tree-node';
  row.style.paddingLeft = `${12 + level * 16}px`;
  row.dataset.id = node.id;
  
  const childrenContainer = document.createElement('div');
  childrenContainer.className = 'tree-children';
  
  const icon = document.createElement('i');
  icon.setAttribute('data-lucide', 'chevron-right');
  icon.style.width = '14px'; icon.style.transition = 'transform 0.2s';
  
  row.innerHTML += `<i data-lucide="folder" style="width:16px;height:16px;"></i> <span>${node.name}</span>`;
  
  if (node.children && node.children.some(c => c.is_dir)) {
    row.prepend(icon);
    row.onclick = (e) => {
      e.stopPropagation();
      childrenContainer.classList.toggle('open');
      const isExpanded = childrenContainer.classList.contains('open');
      icon.style.transform = isExpanded ? 'rotate(90deg)' : 'rotate(0deg)';
      if (isExpanded && childrenContainer.children.length === 0) {
        node.children.filter(c => c.is_dir).forEach(child => renderSidebarNode(child, childrenContainer, level + 1));
        lucide.createIcons({root: childrenContainer});
      }
      navigate(node.id);
    };
  } else {
    row.onclick = () => navigate(node.id);
  }
  
  container.appendChild(row);
  container.appendChild(childrenContainer);
}

function highlightSidebar(nodeId) {
  document.querySelectorAll('.tree-node').forEach(n => n.classList.remove('active'));
  const activeNode = document.querySelector(`.tree-node[data-id="${nodeId}"]`);
  if (activeNode) activeNode.classList.add('active');
}

function renderBreadcrumbs(node) {
  const container = document.getElementById('breadcrumbs');
  container.innerHTML = '';
  
  let path = [];
  let curr = node;
  while(curr) { path.unshift(curr); curr = curr.parent; }
  
  path.forEach((n, idx) => {
    const crumb = document.createElement('div');
    crumb.className = 'crumb';
    crumb.innerHTML = idx === 0 ? `<i data-lucide="hard-drive" style="width:16px"></i> Root` : n.name;
    crumb.addEventListener('click', () => navigate(n.id));
    container.appendChild(crumb);
    
    if (idx < path.length - 1) {
      const sep = document.createElement('div');
      sep.className = 'crumb-separator';
      sep.innerHTML = '<i data-lucide="chevron-right" style="width:14px"></i>';
      container.appendChild(sep);
    }
  });
  lucide.createIcons({root: container});
}

const zoomSlider = document.getElementById('zoom-slider');
zoomSlider.addEventListener('input', (e) => {
  document.documentElement.style.setProperty('--icon-size', `${e.target.value}px`);
});

function formatBytes(bytes) {
  if (!+bytes) return '0 B';
  const k = 1024;
  const sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
  const i = Math.floor(Math.log(bytes) / Math.log(k));
  return `${parseFloat((bytes / Math.pow(k, i)).toFixed(1))} ${sizes[i]}`;
}

async function getVibrantIcon(name, isDir, thumbnailData) {
  if (thumbnailData) return thumbnailData;
  let svg = '';
  if (isDir) {
    svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#7fd4f9"/><stop offset="100%" stop-color="#3098fa"/></linearGradient><linearGradient id="f" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#59c2f8"/><stop offset="100%" stop-color="#0c75fa"/></linearGradient></defs><path d="M8 82C8 88.6 13.4 94 20 94h60c6.6 0 12-5.4 12-12V40c0-6.6-5.4-12-12-12H52.4c-2.4 0-4.6-1.4-5.6-3.6L43.2 17.6c-1-2.2-3.2-3.6-5.6-3.6H20C13.4 14 8 19.4 8 26v56z" fill="url(#b)"/><path d="M8 82C8 88.6 13.4 94 20 94h60c6.6 0 12-5.4 12-12V46c0-6.6-5.4-12-12-12H20C13.4 34 8 39.4 8 46v36z" fill="url(#f)"/></svg>`;
  } else {
    const extMatch = name.match(/\.([^.]+)$/);
    const ext = extMatch ? extMatch[1].substring(0, 4).toUpperCase() : 'FILE';
    const colors = {
      'PDF': ['#ff7062', '#f02416'], 'ZIP': ['#fed05b', '#f2a71d'], 'RAR': ['#fed05b', '#f2a71d'], '7Z': ['#fed05b', '#f2a71d'],
      'MP4': ['#b57afc', '#782ae6'], 'MKV': ['#b57afc', '#782ae6'], 'MOV': ['#b57afc', '#782ae6'], 'AVI': ['#b57afc', '#782ae6'],
      'MP3': ['#fc7aa7', '#e5276b'], 'WAV': ['#fc7aa7', '#e5276b'], 'FLAC': ['#fc7aa7', '#e5276b'],
      'JPG': ['#7afcb4', '#18cf67'], 'PNG': ['#7afcb4', '#18cf67'], 'GIF': ['#7afcb4', '#18cf67'], 'SVG': ['#7afcb4', '#18cf67'],
      'EXE': ['#a0aab8', '#5c6b7e'], 'MSI': ['#a0aab8', '#5c6b7e'], 'DLL': ['#a0aab8', '#5c6b7e'],
      'DOC': ['#5ca2fc', '#196de0'], 'DOCX': ['#5ca2fc', '#196de0'], 'TXT': ['#5ca2fc', '#196de0'],
      'XLS': ['#66d98c', '#1da94b'], 'XLSX': ['#66d98c', '#1da94b'], 'CSV': ['#66d98c', '#1da94b'],
      'PPT': ['#ff9a55', '#e65c00'], 'PPTX': ['#ff9a55', '#e65c00'],
      'PY': ['#fcd05b', '#e6a817'], 'JS': ['#fcd05b', '#e6a817'], 'HTML': ['#ff8855', '#e64400'], 'CSS': ['#55aaff', '#0077e6']
    };
    const [c1, c2] = colors[ext] || ['#f9fafb', '#d1d5db'];
    const textFill = (c1 === '#f9fafb') ? '#4b5563' : 'white';
    const foldColor = (c1 === '#f9fafb') ? '#e5e7eb' : c2;
    
    let iconType = '';
    const extLower = ext.toLowerCase();
    if (['zip','rar','7z'].includes(extLower)) iconType = 'ARCHIVE';
    else if (['mp4','mkv','mov','avi'].includes(extLower)) iconType = 'VIDEO';
    else if (['mp3','wav','flac'].includes(extLower)) iconType = 'AUDIO';
    else if (['jpg','png','gif','svg'].includes(extLower)) iconType = 'IMAGE';
    else if (['py','js','html','css'].includes(extLower)) iconType = 'CODE';
    else if (['pdf','doc','docx','txt','xls','xlsx','ppt','pptx'].includes(extLower)) iconType = 'TEXT';
    
    const innerGraphics = {
      'VIDEO': `<path d="M40 35 L70 50 L40 65 Z" fill="${textFill}"/>`,
      'AUDIO': `<path d="M50 48a8 8 0 10-10 8v-18h15v8h-5z" fill="${textFill}"/>`,
      'ARCHIVE': `<path d="M50 25v30M45 30h10M45 40h10M45 50h10" stroke="${textFill}" stroke-width="4"/><rect x="42" y="55" width="16" height="15" fill="${textFill}" rx="2"/>`,
      'IMAGE': `<path d="M25 65 L45 40 L55 52 L65 38 L80 65 Z" fill="${textFill}"/><circle cx="60" cy="35" r="5" fill="${textFill}"/>`,
      'CODE': `<path d="M42 35 L28 50 L42 65 M58 35 L72 50 L58 65" fill="none" stroke="${textFill}" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>`,
      'TEXT': `<path d="M35 45h30 M35 55h30 M35 65h15" fill="none" stroke="${textFill}" stroke-width="5" stroke-linecap="round"/>`
    };
    
    const innerContent = innerGraphics[iconType] || `<text x="48" y="65" font-family="Inter, sans-serif" font-size="18" font-weight="bold" fill="${textFill}" text-anchor="middle">${ext}</text>`;
    svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${c1}"/><stop offset="100%" stop-color="${c2}"/></linearGradient></defs><path d="M22 10C15.4 10 10 15.4 10 22v56c0 6.6 5.4 12 12 12h52c6.6 0 12-5.4 12-12V34L62 10H22z" fill="url(#g)"/><path d="M62 10v16c0 4.4 3.6 8 8 8h16L62 10z" fill="${foldColor}" opacity="0.8"/>${innerContent}</svg>`;
  }
  return `data:image/svg+xml;utf8,${encodeURIComponent(svg)}`;
}

const io = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const el = entry.target;
      const isDir = el.dataset.isdir === 'true';
      const name = el.dataset.name;
      const thumb = el.dataset.thumb;
      
      getVibrantIcon(name, isDir, thumb).then(url => {
        const img = document.createElement('img');
        img.className = 'item-thumb';
        img.src = url;
        el.innerHTML = '';
        el.appendChild(img);
      });
      io.unobserve(el);
    }
  });
});

const grid = document.getElementById('grid-view');

document.getElementById('btn-toggle-view').addEventListener('click', () => {
  const isList = grid.classList.toggle('list-mode');
  document.getElementById('btn-toggle-view').innerHTML = isList ? '<i data-lucide="grid"></i>' : '<i data-lucide="list"></i>';
  lucide.createIcons();
});

function renderGrid(node) {
  grid.innerHTML = '';
  io.disconnect();
  
  const frag = document.createDocumentFragment();
  node.children.forEach(child => {
    const item = document.createElement('div');
    item.className = 'grid-item';
    item.title = child.name;
    
    const iconWrap = document.createElement('div');
    iconWrap.className = `item-icon ${child.is_dir && !child.thumbnail ? 'folder-icon' : ''}`;
    iconWrap.dataset.isdir = child.is_dir;
    iconWrap.dataset.name = child.name;
    if (child.thumbnail) iconWrap.dataset.thumb = child.thumbnail;
    
    const label = document.createElement('div');
    label.className = 'item-name';
    label.innerText = child.name;
    
    const meta = document.createElement('div');
    meta.className = 'item-meta';
    
    let dateStr = '';
    if (child.mtime) {
      const d = new Date(child.mtime);
      dateStr = d.toLocaleDateString() + ' ' + d.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }
    
    if (child.is_dir) {
      const cCount = child.children ? child.children.length : 0;
      meta.innerHTML = `<span>${dateStr}</span><span>${cCount} items • ${formatBytes(child.size || 0)}</span>`;
    } else {
      meta.innerHTML = `<span>${dateStr}</span><span>${formatBytes(child.size || 0)}</span>`;
    }
    
    if (child.is_dir) {
      item.addEventListener('click', () => navigate(child.id));
    } else {
      item.addEventListener('click', async () => {
        try {
          await navigator.clipboard.writeText(child.name);
          const original = label.innerText;
          label.innerText = 'Copied!';
          label.style.color = '#14b8a6';
          setTimeout(() => {
            label.innerText = original;
            label.style.color = '';
          }, 1200);
        } catch(e) {}
      });
    }
    
    item.appendChild(iconWrap);
    item.appendChild(label);
    item.appendChild(meta);
    frag.appendChild(item);
    
    io.observe(iconWrap);
  });
  
  grid.appendChild(frag);
}

// Init
renderSidebarNode(rawTree, document.getElementById('tree-root'));
lucide.createIcons();
navigate(rawTree.id);

</script>
</body>
